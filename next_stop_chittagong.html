<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Stop Chittagong - Authentic Bangladeshi Street Food</title>
  <style>
    :root {
      --bg-color: #0d130e;
      --card-bg: #162218;
      --accent-color: #ff5722;
      --accent-hover: #e64a19;
      --header-green: #10381e;
      --header-accent: #2e7d32;
      --text-color: #f1f1f1;
      --text-muted: #a3b8a8;
      --tok-fountain-color: #8bc34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(rgba(10, 35, 18, 0.85), rgba(5, 20, 10, 0.9)), 
                  url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      text-align: center;
      padding: 60px 20px;
      border-bottom: 4px solid var(--header-accent);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    header h1 {
      font-size: 3rem;
      color: #76ff03;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }

    header p {
      font-size: 1.2rem;
      color: #c8e6c9;
      max-width: 600px;
      margin: 0 auto;
    }

    .filter-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--header-accent);
      padding: 10px 22px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--header-accent);
      color: #fff;
      box-shadow: 0 0 10px rgba(46, 125, 50, 0.5);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .food-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e3a24;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .food-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(118, 255, 3, 0.2);
    }

    .media-container {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: #000;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fountain-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .card-content {
      padding: 20px;
    }

    .card-title {
      font-size: 1.35rem;
      color: #76ff03;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .card-tag {
      display: inline-block;
      background: rgba(46, 125, 50, 0.3);
      color: #a5d6a7;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .btn-view {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: var(--header-accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-view:hover {
      background: #388e3c;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--header-accent);
    }

    .modal-media {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
    }

    .modal-body {
      padding: 20px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Next Stop Chittagong</h1>
    <p>Dive into the legendary flavors of Bangladeshi street food & rich culinary heritage</p>
  </header>

  <div class="container">
    <div class="filter-container">
      <button class="filter-btn active" onclick="filterFood('all')">All Items</button>
      <button class="filter-btn" onclick="filterFood('snacks')">Snacks & Street Food</button>
      <button class="filter-btn" onclick="filterFood('heavy')">Main Meals</button>
    </div>

    <div class="food-grid" id="foodGrid"></div>
  </div>

  <div class="modal" id="foodModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalMediaContainer"></div>
      <div class="modal-body">
        <h2 id="modalTitle" class="card-title"></h2>
        <p id="modalDesc" class="card-desc"></p>
      </div>
    </div>
  </div>

  <script>
    const foodItems = [
      {
        id: 'fuchka',
        title: 'Bangladeshi Fuchka',
        category: 'snacks',
        desc: 'Crispy golden hollow spheres loaded with spiced mashed potatoes, yellow chickpeas, green chillies, and shredded boiled egg—served with a live continuous fountain of tangy tamarind tok!',
        tag: 'Street Legend',
        type: 'fountain_image',
        mediaUrl: 'https://images.pexels.com/photos/14838589/pexels-photo-14838589.jpeg?auto=compress&cs=tinysrgb&w=800'
      },
      {
        id: 'doi_fuchka',
        title: 'Creamy Doi Fuchka',
        category: 'snacks',
        desc: 'Crispy shells packed with potato-chickpea filling, generously drenched in sweetened whipped yogurt, tamarind chutney, roasted spices, and crispy sev.',
        tag: 'Sweet & Spicy',
        type: 'image',
        mediaUrl: 'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'shingara',
        title: 'Bengali Shingara',
        category: 'snacks',
        desc: 'Flaky, short-crust pastry pyramids filled with a aromatic spiced potato-cauliflower mash and roasted peanuts, fried to golden perfection.',
        tag: 'Classic Snack',
        type: 'image',
        mediaUrl: 'https://images.pexels.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'shingara_chaat',
        title: 'Bangladeshi Shingara Chaat',
        category: 'snacks',
        desc: 'Crispy shingaras broken open and smothered in warm spicy chickpea ghugni, refreshing mint-yogurt sauce, tamarind glaze, chopped onions, and fresh cilantro.',
        tag: 'Ultimate Chaat',
        type: 'image',
        mediaUrl: 'https://images.pexels.com/photo-1589301760014-d929f3979dbc?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'chicken_samosa',
        title: 'Crispy Chicken Samosa',
        category: 'snacks',
        desc: 'Thin, crispy pastry pockets filled with savory minced chicken, green chillies, onions, and traditional spice blends.',
        tag: 'Crispy Non-Veg',
        type: 'image',
        mediaUrl: 'https://images.pexels.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'daal_puri',
        title: 'Bangladeshi Daal Puri',
        category: 'snacks',
        desc: 'Fluffy, deep-fried flatbread stuffed with a dry, aromatic spiced red lentil (masoor dal) filling, served piping hot with green chillies or chutney.',
        tag: 'Breakfast Favorite',
        type: 'image',
        mediaUrl: 'https://images.pexels.com/photo-1626132647523-66f5bf380027?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'khichuri_mejbani',
        title: 'Bhuna Khichuri & Mejbani Beef',
        category: 'heavy',
        desc: 'Fragrant aromatic rice and lentil pilaf served alongside Chittagong’s iconic, deep-red, slow-cooked Mejbani beef curry cooked with rich, intense spices.',
        tag: 'Chittagong Icon',
        type: 'image',
        mediaUrl: 'https://images.unsplash.com/photo-1633945274405-b6c8069047b0?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'chapli_kabaab_puri',
        title: 'Chapli Kabaab with Hot Puri',
        category: 'heavy',
        desc: 'Juicy, pan-fried minced meat patties bursting with pomegranate seeds and herbs, paired with fresh, puffed golden puris.',
        tag: 'Savory Feast',
        type: 'image',
        mediaUrl: 'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'steam_momos',
        title: 'Steamed Chicken Momos',
        category: 'snacks',
        desc: 'Tender steamed dumplings stuffed with juicy seasoned chicken and served with a fiery tomato-sesame chili chutney.',
        tag: 'Hot & Juicy',
        type: 'image',
        mediaUrl: 'https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'jhol_momo',
        title: 'Authentic Jhol Momo',
        category: 'snacks',
        desc: 'Plump steamed dumplings submerged in a warm, tangy, and nutty spiced tomato-sesame broth.',
        tag: 'Soupy Comfort',
        type: 'image',
        mediaUrl: 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=800&q=80'
      }
    ];

    function renderCards(filter = 'all') {
      const grid = document.getElementById('foodGrid');
      grid.innerHTML = '';

      const items = filter === 'all' ? foodItems : foodItems.filter(item => item.category === filter);

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'food-card';

        let mediaHtml = item.type === 'fountain_image'
          ? `<div class="media-container"><img src="${item.mediaUrl}" alt="${item.title}"><canvas id="fountainCanvas" class="fountain-canvas"></canvas></div>`
          : `<div class="media-container"><img src="${item.mediaUrl}" alt="${item.title}"></div>`;

        card.innerHTML = `
          ${mediaHtml}
          <div class="card-content">
            <span class="card-tag">${item.tag}</span>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.desc}</p>
            <button class="btn-view" onclick="openModal('${item.id}')">View Details</button>
          </div>
        `;

        grid.appendChild(card);
      });

      if (filter === 'all' || filter === 'snacks') {
        setTimeout(initTokFountain, 100);
      }
    }

    function initTokFountain() {
      const canvas = document.getElementById('fountainCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      let particles = [];

      class Particle {
        constructor() {
          this.x = canvas.width / 2;
          this.y = canvas.height - 15;
          this.vx = (Math.random() - 0.5) * 3.5;
          this.vy = -Math.random() * 6.5 - 4.5;
          this.gravity = 0.22;
          this.radius = Math.random() * 3 + 1.5;
          this.alpha = 1;
        }

        update() {
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= 0.015;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#8bc34a';
          ctx.fill();
          ctx.restore();
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i = 0; i < 2; i++) {
          particles.push(new Particle());
        }

        particles.forEach((p, index) => {
          p.update();
          p.draw();
          if (p.alpha <= 0 || p.y > canvas.height) {
            particles.splice(index, 1);
          }
        });

        requestAnimationFrame(animate);
      }

      animate();
    }

    function filterFood(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCards(category);
    }

    function openModal(id) {
      const item = foodItems.find(f => f.id === id);
      if(!item) return;

      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalDesc').innerText = item.desc;
      document.getElementById('modalMediaContainer').innerHTML = `<img src="${item.mediaUrl}" class="modal-media" alt="${item.title}">`;

      document.getElementById('foodModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('foodModal').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('foodModal');
      if (event.target == modal) {
        closeModal();
      }
    }

    renderCards();
  </script>
</body>
</html>
